<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pamela &amp; Mariano</title>
<meta name="description" content="Nos casamos y queremos que seas parte de este día. Te esperamos el 23 de enero de 2027 🤍">
<meta property="og:type" content="website">
<meta property="og:title" content="Pamela & Mariano · ¡Nos casamos!">
<meta property="og:description" content="Nos casamos y queremos que seas parte de este día. Te esperamos el 23 de enero de 2027 🤍">
<meta name="theme-color" content="#f4e4d3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="assets/intro-fondo.jpg">
<style>
  :root {
    --tinta: #7a4a2a;       /* marrón de los textos de las piezas */
    --tinta-suave: #946446;
    --terracota: #b8664c;   /* botón "Cómo llegar" del salón */
    --papel: #f6e6d5;
    /* ancho de la columna de la invitación */
    --ancho: min(100vw, 480px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: #ead7c4;
    font-family: "Cormorant Garamond", Georgia, serif;
    color: var(--tinta);
  }
  main {
    width: var(--ancho);
    margin: 0 auto;
    background: var(--papel);
    box-shadow: 0 0 40px rgba(120,74,42,.18);
    overflow: hidden;
    container-type: inline-size;
  }

  /* ===== Piezas encastradas =====
     Cada pieza (1080x1620, 2:3) va a ancho completo, una debajo de la otra.
     Cada una se monta 6cqw sobre la anterior y su borde superior se disuelve, así no se ve el corte. */
  .pieza { position: relative; }
  /* Cada pieza tapa los últimos 14cqw de la anterior: los primeros 10 se funden
     con una curva suave y los 4 finales tapan del todo los bordes de cada imagen
     (algunas traen una costura o un filo más oscuro abajo). */
  .pieza + .pieza {
    margin-top: -14cqw;
    --fundido: linear-gradient(to bottom,
      transparent 0,
      rgba(0,0,0,.08) 2cqw,
      rgba(0,0,0,.3) 4cqw,
      rgba(0,0,0,.62) 6cqw,
      rgba(0,0,0,.88) 8cqw,
      #000 10cqw);
    -webkit-mask-image: var(--fundido);
    mask-image: var(--fundido);
  }
  .lienzo {
    position: relative;
    width: 100%;
    aspect-ratio: 1080 / 1620;
    container-type: inline-size;
    line-height: 0;
  }
  .lienzo > img { width: 100%; height: 100%; display: block; }
  .hot {
    position: absolute;
    display: block;
    cursor: pointer;
    background: transparent;
    border: 0;
    overflow: hidden;
    border-radius: 14px;
    -webkit-tap-highlight-color: transparent;
  }

  /* Portada: entra con un fundido lento cuando se va la intro */
  .portada .lienzo > img { animation: aparece 1.8s ease-out .9s both; }
  body.con-intro .portada .lienzo > img { opacity: 0; animation: none; }
  @keyframes aparece {
    from { opacity: 0; transform: scale(1.03); }
    to   { opacity: 1; transform: none; }
  }

  /* Invitados: nombres y cantidad de lugares como texto vivo */
  .inv-nombre {
    position: absolute;
    left: 10%; right: 10%;
    top: 26.89%; height: 29.63%;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    line-height: 1.05;
    font-family: "Great Vibes", cursive;
    font-size: 11.5cqw;
    color: var(--tinta);
  }
  .inv-lugares {
    position: absolute;
    left: 0; right: 0;
    top: 68.37%;
    transform: translateY(-50%);
    text-align: center;
    line-height: 1;
    font-weight: 400;
    font-size: 15cqw;
    color: var(--tinta);
    font-variant-numeric: lining-nums;
  }

  /* Cuenta regresiva: números dentro de los círculos */
  .cd {
    position: absolute;
    top: 49.29%;
    width: 20%;
    transform: translate(-50%, -50%);
    text-align: center;
    line-height: 1;
    font-weight: 400;
    font-size: 9.6cqw;
    color: var(--tinta);
    font-variant-numeric: lining-nums tabular-nums;
  }
  .cd.cambia { animation: cambia .55s ease-out; }
  @keyframes cambia {
    from { opacity: 0; transform: translate(-50%, -62%); }
    to   { opacity: 1; transform: translate(-50%, -50%); }
  }

  /* ===== Galería "Nosotros" ===== */
  /* fondo: la parte de arriba y la de abajo del papel de la intro, unidas por el mismo tono */
  .galeria {
    background: #f5e3cd;
    padding: 34cqw 7cqw 30cqw;
    container-type: inline-size;
  }
  .galeria::before, .galeria::after {
    content: "";
    position: absolute; left: 0; right: 0;
    height: 90cqw;
    background-image: url("assets/intro-fondo.jpg");
    background-size: 100% auto;
    background-repeat: no-repeat;
    pointer-events: none;
  }
  .galeria::before {
    top: 0;
    background-position: top;
    -webkit-mask-image: linear-gradient(to bottom, #000 70%, transparent);
    mask-image: linear-gradient(to bottom, #000 70%, transparent);
  }
  .galeria::after {
    bottom: 0;
    background-position: bottom;
    -webkit-mask-image: linear-gradient(to top, #000 70%, transparent);
    mask-image: linear-gradient(to top, #000 70%, transparent);
  }
  .galeria > * { position: relative; z-index: 1; }
  .galeria h2 {
    text-align: center;
    font-weight: 400;
    font-size: 11cqw;
    letter-spacing: .22em;
    text-indent: .22em;
    line-height: 1;
    color: var(--tinta);
  }
  .galeria .adorno {
    display: flex; align-items: center; justify-content: center; gap: 3cqw;
    margin: 4cqw 0 8cqw;
    color: var(--tinta-suave);
  }
  .galeria .adorno::before, .galeria .adorno::after {
    content: ""; width: 16cqw; height: 1px; background: currentColor; opacity: .6;
  }
  .galeria .adorno svg { width: 5cqw; height: 5cqw; display: block; }
  .mosaico {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 3cqw;
  }
  .mosaico button {
    position: relative;
    display: block;
    min-width: 0;
    padding: 1.4cqw;
    border: 0;
    border-radius: 3px;
    background: #fdf6ee;
    box-shadow: 0 2px 10px rgba(122,74,42,.16);
    cursor: zoom-in;
    -webkit-tap-highlight-color: transparent;
    opacity: 0;
    transition: opacity 1.2s ease;
  }
  .mosaico button.visto { opacity: 1; }
  .mosaico img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 1px; }
  .mosaico .alta  { grid-row: span 2; }
  .mosaico .ancha { grid-column: span 2; aspect-ratio: 16 / 9; }
  .mosaico .media { aspect-ratio: 3 / 2; }
  .mosaico .cuadro { aspect-ratio: 4 / 5; }

  /* Visor de fotos */
  .visor {
    position: fixed; inset: 0;
    z-index: 55;
    display: flex; align-items: center; justify-content: center;
    background: rgba(40,22,14,.92);
    opacity: 0; visibility: hidden;
    transition: opacity .3s, visibility .3s;
    touch-action: pan-y;
  }
  .visor.abierto { opacity: 1; visibility: visible; }
  .visor img {
    max-width: 94vw; max-height: 86dvh;
    border-radius: 4px;
    box-shadow: 0 20px 50px rgba(0,0,0,.4);
    transition: opacity .25s;
  }
  .visor button {
    position: absolute;
    border: 0; background: none;
    color: #fbefe4;
    font-family: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .visor .cerrar { top: max(10px, env(safe-area-inset-top)); right: 12px; font-size: 38px; line-height: 1; padding: 6px 10px; }
  .visor .ant, .visor .sig { top: 50%; transform: translateY(-50%); font-size: 44px; padding: 20px 12px; opacity: .85; }
  .visor .ant { left: 4px; }
  .visor .sig { right: 4px; }
  .visor .contador {
    position: absolute; bottom: max(18px, env(safe-area-inset-bottom));
    left: 0; right: 0; text-align: center;
    font-size: 16px; letter-spacing: .2em; color: #fbefe4; opacity: .8;
  }

  /* Footer: banda terracota, entra con un fundido corto */
  .pie { position: relative; container-type: inline-size; line-height: 0; margin-top: -6cqw; -webkit-mask-image: linear-gradient(to bottom, transparent 0, transparent 1.5cqw, rgba(0,0,0,.5) 3.5cqw, #000 5.5cqw); mask-image: linear-gradient(to bottom, transparent 0, transparent 1.5cqw, rgba(0,0,0,.5) 3.5cqw, #000 5.5cqw); }
  .pie > img { width: 100%; height: auto; display: block; }
  .pie .hot { border-radius: 50%; }

  /* Modal datos bancarios */
  .modal {
    position: fixed; inset: 0;
    z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px 16px;
    background: rgba(90,48,30,.5);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
    opacity: 0; visibility: hidden;
    transition: opacity .3s, visibility .3s;
  }
  .modal.abierto { opacity: 1; visibility: visible; }
  /* la pieza trae su propio fondo terracota alrededor: se recorta a la tarjeta */
  .modal .tarjeta {
    position: relative;
    width: min(100%, 420px, calc((100dvh - 70px) * 944 / 1460));
    aspect-ratio: 944 / 1460;
    overflow: hidden;
    border-radius: 18px;
    line-height: 0;
    transform: translateY(16px) scale(.97);
    transition: transform .35s ease;
    box-shadow: 0 20px 50px rgba(60,30,18,.4);
  }
  .modal.abierto .tarjeta { transform: none; }
  .modal .tarjeta img {
    position: absolute;
    width: 114.41%;              /* 1080 / 944 */
    left: -6.99%; top: -16.1%;   /* 66 / 944, 235 / 1460 */
  }
  .modal .tarjeta .hot { border-radius: 8px; }
  .modal .ayuda {
    margin-top: 12px;
    font-size: 16px;
    font-style: italic;
    letter-spacing: .06em;
    color: #fbefe4;
  }
  .toast {
    position: fixed; left: 50%; bottom: 32px;
    z-index: 60;
    transform: translate(-50%, 20px);
    background: var(--tinta); color: #fbefe4;
    padding: 10px 20px;
    font-size: 17px; letter-spacing: .08em;
    border-radius: 10px;
    white-space: nowrap;
    opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s;
  }
  .toast.visible { opacity: 1; transform: translate(-50%, 0); }

  /* Ondas al tocar un botón */
  .onda {
    position: absolute;
    width: 20px; height: 20px;
    margin: -10px 0 0 -10px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(184,102,76,.45) 0%, rgba(184,102,76,.18) 45%, rgba(184,102,76,0) 70%);
    pointer-events: none;
    animation: onda .7s ease-out forwards;
  }
  @keyframes onda {
    from { transform: scale(0); opacity: 1; }
    to   { transform: scale(18); opacity: 0; }
  }
  /* Destello que recorre el botón de confirmar */
  .brillo {
    position: absolute; inset: 0;
    pointer-events: none;
    background: linear-gradient(105deg, transparent 35%, rgba(255,240,226,.55) 50%, transparent 65%) no-repeat;
    background-size: 250% 100%;
    animation: brillo 4.5s ease-in-out infinite;
  }
  @keyframes brillo {
    0%        { background-position: 130% 0; }
    45%, 100% { background-position: -30% 0; }
  }

  /* ===== Intro minimalista: papel liso y los nombres que se escriben solos ===== */
  body.con-intro { overflow: hidden; }
  .intro {
    position: fixed; inset: 0;
    z-index: 80;
    overflow: hidden;
    /* solo el centro liso del papel de la intro, muy ampliado: textura sin adornos */
    background: url("assets/intro-fondo.jpg") center / max(300vw, 200vh) auto no-repeat #f5e3cd;
    transition: opacity .9s ease .45s, visibility .9s .45s;
  }
  .intro.abriendo { opacity: 0; visibility: hidden; }
  /* marco fino que se dibuja desde el centro */
  .intro .marco {
    position: absolute; inset: 18px;
    border: 1px solid rgba(122,74,42,.28);
    pointer-events: none;
    animation: marco 1.6s cubic-bezier(.6,0,.2,1) .1s both;
  }
  .intro .marco::after {
    content: ""; position: absolute; inset: 5px;
    border: 1px solid rgba(122,74,42,.14);
  }
  @keyframes marco { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
  .intro .contenido {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 16px;
    text-align: center;
    transition: opacity .5s ease, transform .6s ease;
  }
  .intro.abriendo .contenido { opacity: 0; transform: translateY(-14px); }
  .intro .antetitulo {
    font-weight: 500;
    font-size: 13px;
    letter-spacing: .55em;
    text-indent: .55em;
    color: var(--tinta-suave);
    animation: sube 1.3s ease-out .5s both;
  }
  /* los nombres aparecen de izquierda a derecha, como escritos a mano */
  .intro .nombres {
    margin: 18px 0 0;
    padding: .2em .35em;
    font-family: "Great Vibes", cursive;
    font-weight: 400;
    font-size: clamp(36px, 11.5vw, 62px);
    white-space: nowrap;
    line-height: 1.05;
    color: var(--tinta);
    -webkit-mask-image: linear-gradient(90deg, #000 45%, transparent 55%);
    mask-image: linear-gradient(90deg, #000 45%, transparent 55%);
    -webkit-mask-size: 220% 100%;
    mask-size: 220% 100%;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
    animation: escribe 2.6s cubic-bezier(.45,.1,.4,1) 1.1s both;
  }
  @keyframes escribe {
    from { -webkit-mask-position: 100% 0; mask-position: 100% 0; }
    to   { -webkit-mask-position: 0 0;    mask-position: 0 0; }
  }
  /* trazo fino debajo de los nombres */
  .intro .trazo { width: min(220px, 56vw); height: 18px; margin-top: 2px; color: var(--tinta-suave); overflow: visible; }
  .intro .trazo path {
    fill: none; stroke: currentColor; stroke-width: 1.1; stroke-linecap: round;
    stroke-dasharray: 1; stroke-dashoffset: 1;
    animation: traza 1.4s ease-in-out 3.3s forwards;
  }
  .intro .trazo circle { fill: currentColor; opacity: 0; animation: sube .6s ease-out 4.4s forwards; }
  @keyframes traza { to { stroke-dashoffset: 0; } }
  .intro .fecha {
    margin: 12px 0 38px;
    font-weight: 500;
    font-size: 14px;
    letter-spacing: .4em;
    text-indent: .4em;
    color: var(--tinta-suave);
    animation: sube 1.2s ease-out 3.8s both;
  }
  .intro .botones { animation: sube 1.2s ease-out 4.3s both; }
  .intro .entrar {
    display: block;
    width: min(270px, 76vw);
    padding: 14px 10px;
    border-radius: 14px;
    font-family: inherit;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: .2em;
    text-indent: .2em;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform .2s;
  }
  .intro .entrar:active { transform: scale(.97); }
  .intro .con-musica { border: 0; background: var(--terracota); color: #fbeee2; box-shadow: 0 6px 18px rgba(150,80,50,.25); }
  .intro .sin-musica { margin-top: 12px; border: 1.5px solid var(--tinta-suave); background: rgba(255,250,244,.45); color: var(--tinta); }
  .intro .entrar svg { width: 15px; height: 15px; vertical-align: -2px; margin-right: 8px; }
  @keyframes sube { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  /* ===== Efectos de las secciones ===== */
  /* Las secciones quedan quietas: los efectos pasan POR ENCIMA de ellas */

  /* 1. Un rayo de luz cálida cruza cada sección una vez, cuando llegás a ella */
  .revela { --luz: rgba(255,244,228,.55); }
  .revela .lienzo::after {
    content: "";
    position: absolute; inset: 0;
    z-index: 3;
    pointer-events: none;
    background: linear-gradient(115deg, transparent 30%, var(--luz) 48%, rgba(255,250,240,.7) 50%, var(--luz) 52%, transparent 70%) no-repeat;
    background-size: 300% 100%;
    background-position: 130% 0;
    mix-blend-mode: soft-light;
    opacity: 0;
  }
  .revela.en-vista .lienzo::after { animation: rayo 2.4s ease-in-out .3s; }
  @keyframes rayo {
    0%   { opacity: 0; background-position: 130% 0; }
    15%  { opacity: 1; }
    85%  { opacity: 1; }
    100% { opacity: 0; background-position: -30% 0; }
  }

  /* 2. Destellos dorados que titilan sobre cada sección (los ubica el script) */
  .chispa {
    position: absolute;
    z-index: 3;
    width: 3.2cqw; height: 3.2cqw;
    margin: -1.6cqw 0 0 -1.6cqw;
    pointer-events: none;
    background: radial-gradient(circle, #fff8e6 0 12%, rgba(240,200,140,.85) 18%, transparent 60%);
    clip-path: polygon(50% 0, 58% 42%, 100% 50%, 58% 58%, 50% 100%, 42% 58%, 0 50%, 42% 42%);
    opacity: 0;
    animation: titila 3.8s ease-in-out infinite;
  }
  @keyframes titila {
    0%, 100% { opacity: 0; transform: scale(.3) rotate(0deg); }
    45%      { opacity: .95; transform: scale(1) rotate(45deg); }
    60%      { opacity: .6; transform: scale(.8) rotate(60deg); }
  }

  /* 3. Pétalos que caen muy despacio por toda la invitación */
  .petalos {
    position: fixed; top: 0; bottom: 0;
    left: 50%; transform: translateX(-50%);
    width: var(--ancho);
    z-index: 30;
    pointer-events: none;
  }
  /* destello que recorre los botones de las piezas, cada uno a su ritmo */
  .hot.boton .brillo { animation-duration: 5.5s; }
  /* el botón respira apenas para invitar a tocarlo */
  .hot.boton { animation: respira 3.6s ease-in-out infinite; }
  @keyframes respira { 0%,100% { box-shadow: 0 0 0 0 rgba(184,102,76,0); } 50% { box-shadow: 0 0 0 4px rgba(184,102,76,.18); } }

  /* Botón flotante de música */
  .btn-musica {
    position: fixed;
    right: max(16px, calc(50vw - var(--ancho) / 2 + 16px));
    bottom: max(16px, env(safe-area-inset-bottom));
    z-index: 40;
    width: 48px; height: 48px;
    border-radius: 50%;
    border: 1px solid rgba(148,100,70,.6);
    background: rgba(252,244,236,.94);
    color: var(--terracota);
    display: none; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(120,74,42,.22);
    -webkit-tap-highlight-color: transparent;
  }
  .btn-musica svg { width: 22px; height: 22px; display: block; }
  .btn-musica.visible { display: flex; }
  .btn-musica::after {
    content: "";
    position: absolute; inset: -1px;
    border-radius: 50%;
    border: 1px solid rgba(184,102,76,.6);
    animation: aro 2.2s ease-out infinite;
    pointer-events: none;
  }
  @keyframes aro { from { transform: scale(1); opacity: .9; } to { transform: scale(1.5); opacity: 0; } }
  .btn-musica.pausada::after { display: none; }
  .btn-musica .tachado { opacity: 0; transition: opacity .2s; }
  .btn-musica.pausada .tachado { opacity: 1; }
  .btn-musica.pausada svg .nota { opacity: .55; }

  /* ===== Flash de la cámara (Bloomkeep) =====
     El foco del flash está en el visor de la cámara de la pieza (x 665, y 1010 de 1080x1620).
     Cada tanto "saca una foto": un pre-destello corto y luego el flash fuerte que ilumina la pieza. */
  .camara { --fx: 61.6%; --fy: 62.3%; }
  .camara .flash-luz {
    position: absolute; inset: 0;
    z-index: 4;
    pointer-events: none;
    background: radial-gradient(circle at var(--fx) var(--fy),
      rgba(255,255,255,.98) 0, rgba(255,250,238,.85) 3cqw, rgba(255,240,220,.45) 12cqw,
      rgba(255,236,214,.18) 32cqw, rgba(255,236,214,0) 60cqw);
    mix-blend-mode: screen;
    opacity: 0;
  }
  .camara .flash-estrella {
    position: absolute;
    left: var(--fx); top: var(--fy);
    z-index: 5;
    width: 34cqw; height: 34cqw;
    margin: -17cqw 0 0 -17cqw;
    pointer-events: none;
    background:
      linear-gradient(90deg, transparent 0, rgba(255,255,255,.95) 50%, transparent 100%) center / 100% 1.6% no-repeat,
      linear-gradient(0deg,  transparent 0, rgba(255,255,255,.95) 50%, transparent 100%) center / 1.6% 100% no-repeat,
      radial-gradient(circle, #fff 0 6%, rgba(255,246,228,.7) 12%, transparent 30%);
    opacity: 0;
    transform: scale(.2) rotate(0deg);
  }
  .camara.disparando .flash-luz { animation: flash-luz 1.4s ease-out; }
  .camara.disparando .flash-estrella { animation: flash-estrella 1.4s ease-out; }
  @keyframes flash-luz {
    0%   { opacity: 0; }
    6%   { opacity: .55; }   /* pre-destello */
    12%  { opacity: 0; }
    24%  { opacity: 0; }
    28%  { opacity: 1; }     /* ¡flash! */
    45%  { opacity: .55; }
    100% { opacity: 0; }
  }
  @keyframes flash-estrella {
    0%   { opacity: 0; transform: scale(.2) rotate(0deg); }
    6%   { opacity: .6; transform: scale(.45) rotate(10deg); }
    12%, 24% { opacity: 0; transform: scale(.3) rotate(15deg); }
    28%  { opacity: 1; transform: scale(1.15) rotate(30deg); }
    60%  { opacity: .35; transform: scale(.8) rotate(45deg); }
    100% { opacity: 0; transform: scale(.5) rotate(55deg); }
  }

  /* ===== Mariposa (ilustración PNG, misma lógica que la invitación de Isabella) ===== */
  html { overflow-x: hidden; }
  @supports (overflow: clip) { html, body { overflow-x: clip; } }
  .butterfly {
    position: fixed;
    left: 0; top: 0;
    z-index: 45;
    width: 60px;
    pointer-events: none;
    opacity: 0;
    transform-origin: 50% 75%;
    transition: opacity .7s ease;
    filter: drop-shadow(0 4px 3px rgba(122,74,42,.28));
    will-change: transform, opacity;
  }
  .butterfly.is-visible { opacity: 1; }
  /* scroll hacia arriba: se desvanece lentamente */
  .butterfly.is-visible.is-gone { opacity: 0; transition: opacity 1.8s ease; }
  .butterfly img {
    display: block;
    width: 100%; height: auto;
    user-select: none;
    transform-origin: 50% 55%;
    will-change: transform;
    animation: bf-flap .34s ease-in-out infinite;
  }
  @keyframes bf-flap {
    0%, 100% { transform: perspective(90px) rotateY(0deg) scaleX(1); }
    50%      { transform: perspective(90px) rotateY(62deg) scaleX(.42); }
  }
  /* posada: abre y cierra las alas despacio */
  .butterfly.is-perched img { animation: bf-rest 3.2s ease-in-out infinite; }
  @keyframes bf-rest {
    0%, 100% { transform: perspective(90px) rotateY(0deg) scaleX(1); }
    35%, 50% { transform: perspective(90px) rotateY(55deg) scaleX(.5); }
    80%      { transform: perspective(90px) rotateY(0deg) scaleX(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .camara .flash-luz, .camara .flash-estrella { display: none !important; }
    .portada .lienzo > img, .cd.cambia, .brillo, .hot.boton, .intro * { animation: none !important; }
    .intro .trazo path { stroke-dashoffset: 0; }
    .intro .trazo circle { opacity: 1; }
    .revela .lienzo::after, .chispa, .petalos { display: none !important; }
    .mosaico button { opacity: 1 !important; transition: none !important; }
  }
</style>

<script>
  // ===== Configuración =====
  const EVENTO = new Date('2027-01-23T18:00:00-03:00');
  const LINKS = {
    // TODO: reemplazar por los links exactos de Google Maps (falta confirmar la ciudad)
    ceremonia: 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent('Catedral María Auxiliadora'),
    salon:     'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent('Salón Las Carretas'),
    musica:    'https://open.spotify.com/playlist/5oYgKAkMXhmkaZp5pgTvtA?si=8dGffnKcQ3mdYOBm3IB5XA&pi=OyIjhG4sTd6qY&pt=d1a97c7048ed9656528f6ebfe235cb91',
    bloomkeep: 'https://app.bloomkeep.site/boda-pamela-mariano',
    whatsapp:  'https://wa.me/541140436324',
    instagram: 'https://www.instagram.com/bloomdate.invitaciones/',
    web:       'https://bloomdate-site.netlify.app/'
  };
  document.querySelectorAll('[data-link]').forEach(a => { a.href = LINKS[a.dataset.link] || '#'; });

  // ===== Cuenta regresiva =====
  const cd = {
    d: document.getElementById('cdDias'),
    h: document.getElementById('cdHoras'),
    m: document.getElementById('cdMin'),
    s: document.getElementById('cdSeg')
  };
  function tick() {
    let diff = Math.max(0, EVENTO - Date.now()) / 1000;
    const d = Math.floor(diff / 86400); diff -= d * 86400;
    const h = Math.floor(diff / 3600);  diff -= h * 3600;
    const m = Math.floor(diff / 60);
    const s = Math.floor(diff - m * 60);
    poner(cd.d, String(d).padStart(2, '0'));
    poner(cd.h, String(h).padStart(2, '0'));
    poner(cd.m, String(m).padStart(2, '0'));
    poner(cd.s, String(s).padStart(2, '0'));
  }
  // con 3 cifras de días achica un poco el número para que entre en el círculo
  cd.d.style.fontSize = (EVENTO - Date.now()) / 864e5 >= 100 ? '8cqw' : '';
  function poner(el, valor) {
    if (el.textContent === valor) return;
    el.textContent = valor;
    el.classList.remove('cambia');
    void el.offsetWidth;
    el.classList.add('cambia');
  }
  tick();
  setInterval(tick, 1000);

  // ===== Modal regalos =====
  const modal = document.getElementById('modalRegalos');
  const toast = document.getElementById('toast');
  const abrirModal = () => { modal.classList.add('abierto'); document.body.style.overflow = 'hidden'; };
  const cerrarModal = () => { modal.classList.remove('abierto'); document.body.style.overflow = ''; };
  document.getElementById('abrirRegalos').addEventListener('click', abrirModal);
  document.querySelectorAll('.cerrar-modal').forEach(b => b.addEventListener('click', cerrarModal));
  modal.addEventListener('click', e => { if (e.target === modal || e.target.classList.contains('ayuda')) cerrarModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarModal(); });
  let toastTimer;
  document.querySelectorAll('[data-copiar]').forEach(b => b.addEventListener('click', async () => {
    const texto = b.dataset.copiar;
    try { await navigator.clipboard.writeText(texto); }
    catch {
      const t = document.createElement('textarea');
      t.value = texto; document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); } catch {}
      t.remove();
    }
    toast.textContent = b.dataset.nombre + ' copiado';
    toast.classList.add('visible');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('visible'), 1800);
  }));

  // ===== Secciones que aparecen al llegar a ellas =====
  const revelables = document.querySelectorAll('.revela');
  if ('IntersectionObserver' in window) {
    const ioSec = new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add('en-vista'); ioSec.unobserve(e.target); }
    }), { threshold: .05 });
    revelables.forEach(s => ioSec.observe(s));
  } else revelables.forEach(s => s.classList.add('en-vista'));

  // ===== Destellos dorados: 3 por pieza, en lugares y ritmos distintos =====
  const quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!quieto) document.querySelectorAll('.lienzo').forEach((lz, n) => {
    for (let k = 0; k < 3; k++) {
      const c = document.createElement('span');
      c.className = 'chispa';
      // repartidos por los bordes y zonas de papel, lejos del centro donde va el texto
      const x = [8 + Math.random() * 18, 74 + Math.random() * 18, 15 + Math.random() * 70][k];
      const y = [6 + Math.random() * 20, 20 + Math.random() * 30, 82 + Math.random() * 12][k];
      c.style.left = x + '%';
      c.style.top = y + '%';
      c.style.animationDelay = (n * .7 + k * 1.3 + Math.random()) % 4 + 's';
      c.style.animationDuration = 3.2 + Math.random() * 1.6 + 's';
      lz.appendChild(c);
    }
  });

  // ===== Pétalos que caen despacio =====
  (function () {
    if (quieto) return;
    const lienzo = document.createElement('canvas');
    lienzo.className = 'petalos';
    lienzo.setAttribute('aria-hidden', 'true');
    document.body.appendChild(lienzo);
    const ctx = lienzo.getContext('2d');
    const colores = ['#c9826a', '#d9a08a', '#e8c4b0', '#f3e2d2', '#b8664c'];
    let W, H, dpr;
    function medir() {
      dpr = Math.min(devicePixelRatio || 1, 2);
      W = lienzo.clientWidth; H = lienzo.clientHeight;
      lienzo.width = W * dpr; lienzo.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    medir();
    addEventListener('resize', medir);
    const nuevo = (arriba) => ({
      x: Math.random() * W,
      y: arriba ? -20 - Math.random() * H * .5 : Math.random() * H,
      r: 4 + Math.random() * 5,
      vy: .25 + Math.random() * .35,
      fase: Math.random() * 6.28,
      giro: Math.random() * 6.28,
      vg: (Math.random() - .5) * .02,
      color: colores[Math.floor(Math.random() * colores.length)],
      alfa: .35 + Math.random() * .35
    });
    const petalos = Array.from({ length: 12 }, () => nuevo(false));
    let t = 0;
    function dibujar() {
      ctx.clearRect(0, 0, W, H);
      t += .016;
      petalos.forEach((p, i) => {
        p.y += p.vy;
        p.x += Math.sin(t + p.fase) * .35;
        p.giro += p.vg;
        if (p.y > H + 20) petalos[i] = nuevo(true);
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.giro);
        ctx.scale(1, .55 + Math.sin(t * 1.5 + p.fase) * .25);   // el pétalo "gira" en el aire
        ctx.globalAlpha = p.alfa;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.moveTo(0, -p.r);
        ctx.bezierCurveTo(p.r * .9, -p.r * .6, p.r * .7, p.r * .7, 0, p.r);
        ctx.bezierCurveTo(-p.r * .7, p.r * .7, -p.r * .9, -p.r * .6, 0, -p.r);
        ctx.fill();
        ctx.restore();
      });
      if (!document.hidden) requestAnimationFrame(dibujar);
    }
    document.addEventListener('visibilitychange', () => { if (!document.hidden) requestAnimationFrame(dibujar); });
    requestAnimationFrame(dibujar);
  })();

  // ===== Flash de la cámara de Bloomkeep: dispara al llegar y cada tantos segundos mientras se ve =====
  (function () {
    const cam = document.getElementById('camara');
    if (!cam || quieto) return;
    let visible = false, timer = 0;
    function disparar() {
      cam.classList.remove('disparando');
      void cam.offsetWidth;
      cam.classList.add('disparando');
    }
    function ciclo() {
      clearTimeout(timer);
      if (!visible || document.hidden) return;
      disparar();
      timer = setTimeout(ciclo, 4200 + Math.random() * 1800);
    }
    cam.addEventListener('animationend', e => { if (e.animationName === 'flash-luz') cam.classList.remove('disparando'); });
    // tocar la cámara también saca una foto
    cam.querySelector('.lienzo').addEventListener('click', e => {
      const r = e.currentTarget.getBoundingClientRect();
      if ((e.clientY - r.top) / r.height > .57 && !e.target.closest('.hot')) disparar();
    });
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(es => es.forEach(e => {
        const antes = visible;
        visible = e.isIntersecting;
        if (visible && !antes) timer = setTimeout(ciclo, 700);
        if (!visible) clearTimeout(timer);
      }), { threshold: .45 }).observe(cam);
    }
    document.addEventListener('visibilitychange', () => { if (!document.hidden && visible) ciclo(); });
  })();

  // ===== Galería: aparición suave y visor =====
  const fotos = [...document.querySelectorAll('.mosaico button')];
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add('visto'); io.unobserve(e.target); }
    }), { threshold: .15 });
    fotos.forEach((f, i) => { f.style.transitionDelay = (i % 2) * .15 + 's'; io.observe(f); });
  } else fotos.forEach(f => f.classList.add('visto'));

  const visor = document.getElementById('visor');
  const visorImg = document.getElementById('visorImg');
  const visorContador = document.getElementById('visorContador');
  let actual = 0;
  function mostrar(i) {
    actual = (i + fotos.length) % fotos.length;
    const img = fotos[actual].querySelector('img');
    visorImg.src = img.src;
    visorImg.alt = img.alt;
    visorContador.textContent = (actual + 1) + ' / ' + fotos.length;
  }
  const abrirVisor = i => { mostrar(i); visor.classList.add('abierto'); document.body.style.overflow = 'hidden'; };
  const cerrarVisor = () => { visor.classList.remove('abierto'); document.body.style.overflow = ''; };
  fotos.forEach(f => f.addEventListener('click', () => abrirVisor(+f.dataset.i)));
  document.getElementById('visorCerrar').addEventListener('click', cerrarVisor);
  document.getElementById('visorAnt').addEventListener('click', () => mostrar(actual - 1));
  document.getElementById('visorSig').addEventListener('click', () => mostrar(actual + 1));
  visor.addEventListener('click', e => { if (e.target === visor) cerrarVisor(); });
  document.addEventListener('keydown', e => {
    if (!visor.classList.contains('abierto')) return;
    if (e.key === 'Escape') cerrarVisor();
    if (e.key === 'ArrowLeft') mostrar(actual - 1);
    if (e.key === 'ArrowRight') mostrar(actual + 1);
  });
  let toqueX = null;
  visor.addEventListener('touchstart', e => { toqueX = e.touches[0].clientX; }, { passive: true });
  visor.addEventListener('touchend', e => {
    if (toqueX === null) return;
    const dx = e.changedTouches[0].clientX - toqueX;
    if (Math.abs(dx) > 40) mostrar(actual + (dx < 0 ? 1 : -1));
    toqueX = null;
  });

  // ===== Ondas al tocar botones =====
  document.querySelectorAll('.hot').forEach(b => b.addEventListener('pointerdown', e => {
    const r = b.getBoundingClientRect();
    const o = document.createElement('span');
    o.className = 'onda';
    o.style.left = (e.clientX - r.left) + 'px';
    o.style.top = (e.clientY - r.top) + 'px';
    b.appendChild(o);
    setTimeout(() => o.remove(), 750);
  }));

  // ===== Confirmar asistencia: sin token el link queda en "#" y no abre nada =====
  document.getElementById('boton-confirmar').addEventListener('click', e => {
    if (e.currentTarget.getAttribute('href') === '#') e.preventDefault();
  });

  // ===== Intro y música =====
  const intro = document.getElementById('intro');
  const audio = document.getElementById('musica');
  const btnMusica = document.getElementById('btnMusica');
  let abierta = false;
  function entrar(conMusica) {
    if (abierta) return;
    abierta = true;
    intro.classList.add('abriendo');
    // la página se libera cuando la intro ya se está yendo
    setTimeout(() => { document.body.classList.remove('con-intro'); window.scrollTo(0, 0); }, 600);
    setTimeout(() => intro.remove(), 1600);
    btnMusica.classList.add('visible');
    if (conMusica) audio.play().catch(() => btnMusica.classList.add('pausada'));
    else btnMusica.classList.add('pausada');
  }
  document.getElementById('entrarConMusica').addEventListener('click', () => entrar(true));
  document.getElementById('entrarSinMusica').addEventListener('click', () => entrar(false));
  btnMusica.addEventListener('click', () => { if (audio.paused) audio.play(); else audio.pause(); });
  audio.addEventListener('play',  () => { btnMusica.classList.remove('pausada'); btnMusica.setAttribute('aria-label', 'Pausar música'); });
  audio.addEventListener('pause', () => { btnMusica.classList.add('pausada');    btnMusica.setAttribute('aria-label', 'Reproducir música'); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && !audio.paused) audio.pause(); });
</script>

  function formatNames(names) {
    if (names.length === 1) return names[0];
    return names.slice(0, -1).join(", ") + " y " + names[names.length - 1];
  }

  async function initInvitation() {
    var token = new URLSearchParams(window.location.search).get("invite");
    if (!token) return;
    try {
      var response = await fetch(SUPABASE_URL + "/rest/v1/rpc/get_invite_by_token", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": "Bearer " + SUPABASE_ANON_KEY
        },
        body: JSON.stringify({ p_token: token })
      });
      if (!response.ok) return;
      var rows = await response.json();
      var invite = rows && rows[0];
      if (!invite) return;

      var companions = invite.companions || [];
      var names = [invite.first_name].concat(
        companions.map(function (companion) { return companion.first_name; })
      ).filter(Boolean);
      if (!names.length) return;

      var namesEl = document.getElementById("nombres-invitados");
      if (namesEl) namesEl.textContent = formatNames(names);

      // Debajo de "LUGARES RESERVADOS" va solo el número de pases
      var passesEl = document.getElementById("cantidad-lugares");
      if (passesEl) passesEl.textContent = String(1 + companions.length);

      var confirmBtn = document.getElementById("boton-confirmar");
      if (confirmBtn && invite.event_slug) {
        confirmBtn.href = RSVP_BASE + "/r/" + encodeURIComponent(invite.event_slug) + "?invite=" + encodeURIComponent(token);
      }
    } catch (_error) {
      return;
    }
  }
  initInvitation();
})();
</script>
